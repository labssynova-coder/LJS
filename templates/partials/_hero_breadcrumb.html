<section class="py-5 bg-light">
  <div class="container">
    <div class="row px-4 px-lg-5 py-lg-4 align-items-center">
      <div class="col-lg-6">
        <h1 class="h2 text-uppercase mb-0">{{ title }}{{ title_suffix }}</h1>
      </div>
      <div class="col-lg-6 text-lg-right">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-lg-end mb-0 px-0">
            <li class="breadcrumb-item"><a href="{{ bc1_url }}">{{ bc1_label }}</a></li>
            {% if bc3_label %}
              <li class="breadcrumb-item"><a href="{{ bc2_url }}">{{ bc2_label }}</a></li>
              <li class="breadcrumb-item active" aria-current="page">{{ bc3_label }}</li>
            {% else %}
              <li class="breadcrumb-item active" aria-current="page">{{ bc2_label }}</li>
            {% endif %}
          </ol>
        </nav>
      </div>
    </div>
  </div>
</section>
